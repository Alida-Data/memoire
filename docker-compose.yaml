version: '3.8'

services:
  # ---------------------------------------------------
  # BASE DE DONNÉES & BUCKET OBJECT STORAGE
  # ---------------------------------------------------
  postgres:
    image: postgres:15
    container_name: postgres_memoire
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=memoire
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_v5:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      pipeline_network:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memoire"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio_memoire
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - pipeline_network

  # ---------------------------------------------------
  # FRONTEND & SERVICES APPLICATIFS / ML / RAG
  # ---------------------------------------------------
  frontend_react:
    build: ./frontend
    container_name: frontend_react_memoire
    tty: true
    ports:
      - "5173:5173"
    networks:
      - pipeline_network

  rag_assistant:
    build:
      context: .
      dockerfile: Dockerfile.rag
    container_name: rag_assistant_memoire
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONPATH=/app:/app/backend
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - POSTGRES_HOST=postgres_memoire
      - POSTGRES_PORT=5432
      - POSTGRES_DB=memoire
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - SHARED_DATA_DIR=/app/shared_data
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./rag_docs:/app/rag_docs
      - ./shared_data:/app/shared_data
      - chroma_data:/app/chroma_db
    networks:
      - pipeline_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_memoire
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - pipeline_network

  # ---------------------------------------------------
  # MLFLOW TRACKING SERVER & PROXY
  # ---------------------------------------------------
  mlflow_server:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: mlflow_server_memoire
    expose:
      - "5000"
    volumes:
      - mlflow_data:/mlruns
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlruns/mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlruns
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlruns/mlflow.db
      --default-artifact-root /mlruns
      --host 0.0.0.0
      --port 5000
    networks:
      - pipeline_network


  mlflow_proxy:
    image: nginx:alpine
    container_name: mlflow_proxy_memoire
    ports:
      - "5000:5000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mlflow_server
    networks:
      - pipeline_network

  # ---------------------------------------------------
  # MICROSERVICES ETL
  # ---------------------------------------------------
  extract-service:
    build: 
      context: .
      dockerfile: Dockerfile.extract
    container_name: extract_microservice
    tty: true
    ports: 
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/memoire
      - KAGGLE_USERNAME=sopiealidandin
      - KAGGLE_KEY=KGAT_126cf48b86c24cb9f22c64b91b49c054
    volumes: 
      - shared_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      pipeline_network:
        aliases:
          - extract-service

  transform-service:
    build:
      context: .
      dockerfile: Dockerfile.transform
    container_name: transform_microservice
    tty: true
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/memoire
      - MLFLOW_TRACKING_URI=http://mlflow_proxy:5000
    volumes:
      - shared_data:/data
      - mlflow_data:/mlruns
    depends_on:
      postgres:
        condition: service_healthy
      mlflow_proxy:
        condition: service_started
    networks:
      pipeline_network:
        aliases:
          - transform-service

  load-service:
    build: 
      context: .
      dockerfile: Dockerfile.load
    container_name: load_microservice
    tty: true
    ports: 
      - "8003:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/memoire
    volumes: 
      - shared_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      pipeline_network:
        aliases:
          - load-service

  # ---------------------------------------------------
  # ORCHESTRATION APACHE AIRFLOW
  # ---------------------------------------------------
  airflow-init:
    image: apache/airflow:2.7.3-python3.10
    container_name: airflow_init_memoire
    command: db init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/memoire
      - AIRFLOW__WEBSERVER__WORKERS=1
      - AIRFLOW__SCHEDULER__PARALLELISM=2
      - AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG=1
    networks:
      - pipeline_network

  airflow-webserver:
    image: apache/airflow:2.7.3-python3.10
    container_name: airflow_webserver_memoire
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports: 
      - "8082:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/memoire
      - AIRFLOW__WEBSERVER__SECRET_KEY=cle_secrete_pour_le_memoire_miage_12345
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - _AIRFLOW_WWW_USER_FIRSTNAME=Alida
      - _AIRFLOW_WWW_USER_LASTNAME=MIAGE
      - _AIRFLOW_WWW_USER_EMAIL=alida@example.com
      - _AIRFLOW_WWW_USER_ROLE=Admin
      - AIRFLOW_CONN_HTTP_EXTRACT=http://extract-service:8000
      - AIRFLOW_CONN_HTTP_TRANSFORM=http://transform-service:8000
      - AIRFLOW_CONN_HTTP_LOAD=http://load-service:8000
    networks:
      - pipeline_network

  airflow-scheduler:
    image: apache/airflow:2.7.3-python3.10
    container_name: airflow_scheduler_memoire
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/memoire
      - AIRFLOW__WEBSERVER__SECRET_KEY=cle_secrete_pour_le_memoire_miage_12345
      - AIRFLOW_CONN_HTTP_EXTRACT=http://extract-service:8000
      - AIRFLOW_CONN_HTTP_TRANSFORM=http://transform-service:8000
      - AIRFLOW_CONN_HTTP_LOAD=http://load-service:8000
      - AIRFLOW__WEBSERVER__WORKERS=1
      - AIRFLOW__SCHEDULER__PARALLELISM=2
      - AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG=1
    networks:
      - pipeline_network

  # ---------------------------------------------------
  # OBSERVABILITÉ & MONITORING (PROMETHEUS, GRAFANA, CADVISOR)
  # ---------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - pipeline_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres_memoire:5432/memoire?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - pipeline_network
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - pipeline_network

  
  
  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana_memoire
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - pipeline_network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - pipeline_network

# ---------------------------------------------------
# VOLUMES PERSISTANTS

volumes:
  postgres_data_v5:
  shared_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
  chroma_data:
  qdrant_data:
  minio_data:

# ---------------------------------------------------
# RÉSEAUX DOCKER
# ---------------------------------------------------
networks:
  pipeline_network:
    driver: bridge
  app-network:
    driver: bridge